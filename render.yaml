services:
  - type: web
    name: slipkit
    runtime: docker
    repo: https://github.com/reza-adityawar/zhafran
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthcheck
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,read_products,write_files,read_customers
      - key: DATABASE_URL
        fromDatabase:
          name: slipkit-db
          property: connectionString

databases:
  - name: slipkit-db
    plan: free
